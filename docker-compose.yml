services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 17 Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: bookism_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookshelf}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookshelf}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - bookism_network

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Caching Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bookism_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bookism_network

  # ----------------------------------------------------------------------------
  # Ephemeral EF Core Database Migration Runner
  # Applies migrations automatically once PostgreSQL is ready, then exits cleanly
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: bookism_migration
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookshelf};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookism_network

  # ----------------------------------------------------------------------------
  # ASP.NET Core 8 Web API Application Service
  # Runs as non-root user (app) after DB, Redis, and Migrations are completed
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: bookism_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5164}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookshelf};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - bookism_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: bookism_postgres_data
  redis_data:
    name: bookism_redis_data

# ------------------------------------------------------------------------------
# Isolated Network
# ------------------------------------------------------------------------------
networks:
  bookism_network:
    name: bookism_network
    driver: bridge
