name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Automated Unit Testing with Code Coverage
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (8.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet Dependencies
        run: dotnet restore bookism.sln

      - name: Compile Solution (Release Mode)
        run: dotnet build bookism.sln -c Release --no-restore

      - name: Execute Tests & Generate Code Coverage
        run: |
          dotnet test tests/bookism.Tests/bookism.Tests.csproj \
            -c Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-reports
          path: ./coverage-results
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 2: Multi-Stage Dockerfile Build Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image (Stage: Final)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: false
          tags: bookism-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Image (Stage: Migrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: false
          tags: bookism-migration:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
